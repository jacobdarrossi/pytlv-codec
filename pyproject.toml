[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytlv-codec"
version = "0.1.0"
description = "Configurable TLV/LTV codec for payment protocol sub-fields (ISO 8583, acquirer-style)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Jacob Darrossi", email = "jacob.darrossi@gmail.com" },
]
keywords = ["tlv", "ltv", "iso8583", "payments", "codec", "fintech", "bcd"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/jacobdarrossi/pytlv-codec"
Issues = "https://github.com/jacobdarrossi/pytlv-codec/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pytlv_codec"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/pytlv_codec"]
